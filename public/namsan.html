<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Намсан цамхаг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1f2a;--paper:#ffffffe8;--muted:#5d6475;--line:#1b1f2a1f;--accent:#7c6cf0;--gold:#ffc93c;--shadow:0 10px 30px #0b12204d;--ui:"Manrope",system-ui,sans-serif;--ko:"Noto Sans KR",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#eef1f7;--paper:#161b26e8;--muted:#a2aabb;--line:#ffffff22}}
:root[data-theme="dark"]{--ink:#eef1f7;--paper:#161b26e8;--muted:#a2aabb;--line:#ffffff22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fb4c6;font-family:var(--ui);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.panel{background:var(--paper);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#card{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:10px 14px;max-width:min(340px,calc(100vw - 24px))}
#card .t{font-weight:800;font-size:17px;line-height:1.1}
#card .t span{font-family:var(--ko);font-weight:900;margin-left:6px;color:var(--accent)}
#card .s{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#card .src{font-weight:800;border-radius:999px;padding:2px 9px;font-size:11.5px}
#card .src.ok{background:#22a86122;color:#1c8a4f}
#card .src.demo{background:#ffc93c33;color:#9a6a00}
#card .note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.35}
#card button{border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:800;font-size:12px}
#emotes{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:6px;padding:6px}
#emotes button{width:46px;height:46px;border-radius:12px;font-size:22px;display:grid;place-items:center;position:relative}
#emotes button:hover,#emotes button.on{background:#7c6cf022}
#emotes button small{position:absolute;right:3px;bottom:1px;font-size:9.5px;font-weight:800;color:var(--muted)}
.touch #emotes button small{display:none}
#help{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 14px;font-size:12.5px;color:var(--muted);text-align:center;max-width:calc(100vw - 32px);transition:opacity .6s;white-space:nowrap}
#help b{color:var(--ink)}
#hint{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);padding:8px 14px;font-size:14px;display:none;text-align:center;max-width:calc(100vw - 600px);min-width:240px}
#hint b{font-family:var(--ko);font-size:17px}
#touch{display:none}
.touch #touch{display:block}
.touch #help .pc{display:none}
#help .mob{display:none}
.touch #help .mob{display:inline}
.touch #help{bottom:calc(176px + env(safe-area-inset-bottom));white-space:normal}
#joy{position:absolute;left:calc(22px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:#1b1f2a40;border:2px solid #ffffffb0;backdrop-filter:blur(4px)}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fffffff0;box-shadow:0 4px 14px #0004}
.tbtn{position:absolute;width:68px;height:68px;border-radius:50%;background:#ffffffd9;box-shadow:0 6px 18px #0003;font-size:26px;display:grid;place-items:center;font-weight:800;color:#1b1f2a}
#bJump{right:calc(22px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom))}
#bRun{right:calc(30px + env(safe-area-inset-right));bottom:calc(112px + env(safe-area-inset-bottom));width:54px;height:54px;font-size:13px}
#bRun.on{background:var(--gold)}
#quests{position:absolute;left:max(12px,env(safe-area-inset-left));top:calc(max(12px,env(safe-area-inset-top)) + 92px);width:min(300px,calc(100vw - 24px));padding:10px 12px}
#quests h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
#quests h4 b{color:#1c8a4f;font-size:14px;letter-spacing:0}
#quests h4 button{font-size:16px;line-height:1;padding:0 4px}
.q{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:10px;font-size:13px;line-height:1.3;width:100%;text-align:left}
.q.on{background:#7c6cf01f;outline:1.5px solid var(--accent)}
.q .ic{flex:none;width:22px;text-align:center}.q.done{color:var(--muted)}.q.done .t{text-decoration:line-through}.q .stars{color:var(--gold);font-size:11px}
#quests.min .q:not(.on){display:none}
#prompt{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 16px;font-weight:700;font-size:14px;display:none;align-items:center;gap:10px;white-space:nowrap}
#prompt kbd{background:var(--ink);color:#fff;border-radius:6px;padding:2px 8px;font-family:var(--ui)}
#snd{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 70px);width:46px;height:46px;border-radius:14px;font-size:20px}
#dlg{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(640px,calc(100vw - 24px));padding:16px;display:none;flex-direction:column;gap:10px;max-height:calc(100vh - 40px);overflow:auto;z-index:3}
#dlg .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#dlg .badge{background:#e2574c;color:#fff;font-weight:800;border-radius:10px;padding:4px 10px;font-size:13px;font-family:var(--ko)}
#dlg .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;background:var(--paper)}
#dMic.on{background:#e2574c;color:#fff;border-color:#e2574c;animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px #e2574c33}}
#dlg .line{font-family:var(--ko);font-size:24px;font-weight:900;line-height:1.35}#dlg .rom{font-size:13px;color:var(--muted);font-style:italic;margin-top:-6px}
#dlg .mn{font-size:14px;color:#2f6bff;font-weight:700;display:none}#dlg.hint .mn,#dlg.hint .ch .cm{display:block}
#dlg .chs{display:grid;gap:8px}.ch{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}.ch:hover{border-color:#2f6bff}
.ch .ck{font-family:var(--ko);font-size:18px;font-weight:800}.ch .cr{font-size:12px;color:var(--muted);font-style:italic}.ch .cm{font-size:12.5px;color:#2f6bff;font-weight:700;display:none}
.ch.bad{border-color:#e5484d;background:#e5484d14;animation:shake .3s}.ch.good{border-color:#22a861;background:#22a86118}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#dlg .fb{font-size:13.5px;font-weight:700;border-radius:10px;padding:8px 10px;display:none}#dlg .fb.bad{display:block;background:#e5484d18;color:#e5484d}#dlg .fb.good{display:block;background:#22a86118;color:#1c8a4f}
#passed{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:8;pointer-events:none;opacity:0;transform:scale(1.1);transition:opacity .35s,transform .35s}#passed.on{opacity:1;transform:none}
#passed .t1{font-weight:800;font-size:clamp(28px,6vw,52px);color:#fff;text-shadow:0 4px 24px #0009}#passed .t2{font-weight:700;font-size:clamp(16px,3vw,22px);color:#ffe7a8;text-shadow:0 2px 12px #000a;margin-top:6px}
#bTalk{right:calc(104px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));background:#e2574c;color:#fff;display:none}
.touch #prompt{bottom:calc(178px + env(safe-area-inset-bottom))}
#loading{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:linear-gradient(#5b86c0,#c9d4dc);font-weight:800;font-size:18px;color:#fff;text-align:center}
#loading .k{font-family:var(--ko);font-size:44px;display:block;text-shadow:0 4px 18px #0005}
@media (max-width:760px){#hint{max-width:calc(100vw - 24px);top:auto;bottom:calc(190px + env(safe-area-inset-bottom))}#emotes{top:auto;bottom:calc(200px + env(safe-area-inset-bottom));flex-direction:column}#card{max-width:calc(100vw - 24px)}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="loading"><div><span class="k">남산서울타워</span>Намсан цамхаг ачаалж байна…</div></div>
<div id="hud" hidden>
  <div id="card" class="panel"><div class="t">Намсан цамхаг<span>남산서울타워</span></div><div class="s"><span id="src" class="src"></span><button id="rnd" hidden>🎲 Өөр дүр</button></div><div class="note" id="note" hidden>TriBee профайл дээрээ бүтээсэн дүрээрээ орж ирвэл энд таны дүр гарна.</div></div>
  <div id="emotes" class="panel">
    <button data-m="calm" title="Тайван (1)">🙂<small>1</small></button>
    <button data-m="wave" title="Даллах (2)">👋<small>2</small></button>
    <button data-m="dance" title="Бүжиглэх (3)">💃<small>3</small></button>
    <button data-m="jump" title="Үсрэх (4)">🦘<small>4</small></button>
  </div>
  <div id="hint" class="panel"></div>
  <div id="quests" class="panel"><h4>Даалгавар <span id="qcount"></span><b id="money"></b><button id="qmin">–</button></h4><div id="qlist"></div></div>
  <button id="snd" class="panel" title="Дуу">🔊</button>
  <div id="prompt" class="panel"><kbd>E</kbd><span id="promptT"></span></div>
  <div id="dlg" class="panel">
    <div class="who"><span class="badge" id="dWho"></span><span id="dStep" style="font-size:12px;color:var(--muted)"></span><span class="sp"><button class="chip" id="dSay">🔊 Дахин сонсох</button><button class="chip" id="dMic">🎤 Хэлж хариулах</button><button class="chip" id="dHint">💡 Орчуулга</button><button class="chip" id="dX">✕</button></span></div>
    <div class="line" id="dLine"></div><div class="rom" id="dRom"></div><div class="mn" id="dMn"></div><div class="chs" id="dChs"></div><div class="fb" id="dFb"></div>
  </div>
  <div id="help" class="panel"><span class="pc"><b>WASD</b> алхах · <b>Хулгана/тачпад чирэх</b> эргэж харах · <b>Дугуй</b> ойртох · <b>Space</b> үсрэх · <b>Shift</b> гүйх · <b>1–4</b> хөдөлгөөн</span><span class="mob"><b>Джойстик</b> алхах · <b>Дэлгэц чирэх</b> харах · <b>Хоёр хуруу</b> ойртох</span></div>
  <div id="touch"><div id="joy"><div id="knob"></div></div><button class="tbtn" id="bJump" aria-label="Үсрэх">⤒</button><button class="tbtn" id="bRun" aria-label="Гүйх">ГҮЙХ</button><button class="tbtn" id="bTalk" aria-label="Ярих">💬</button></div>
</div>
<div id="passed"><div class="t1" id="pT1"></div><div class="t2" id="pT2"></div>
</div>
<script src="/vendor/three.min.js"></script>
<script src="/tribee-avatar3d.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const isTouch = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
if (isTouch) document.documentElement.classList.add("touch");
const LOW = isTouch || /[?&]low\b/.test(location.search);
THREE.ColorManagement.legacyMode = false;
const AV = window.TribeeAvatar3D;
const R = (a, b) => a + Math.random() * (b - a);
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646, RR = (a, b) => a + rnd() * (b - a);

/* ================= THE MEMBER'S TRIBEE AVATAR =================
   TriBee hands the avatar over in one of two ways:
   1) link:   /namsan#tribee=<base64url of {"look":{...},"name":"...","energy":80}>
   2) iframe: parent.postMessage({type:"tribee-buddy", look, name, energy}, gameOrigin)
   The last one received is remembered in this browser. */
const TRIBEE_ORIGINS = /^https:\/\/(tribee\.pages\.dev|(www\.)?tribee\.ub\.mn|tribee\.zzosho831\.chatgpt\.site)$/;
function fromHash() {
  const m = location.hash.match(/tribee=([A-Za-z0-9_\-+/=%]+)/); if (!m) return null;
  try {
    const b = decodeURIComponent(m[1]).replace(/-/g, "+").replace(/_/g, "/"), bin = atob(b + "===".slice((b.length + 3) % 4));
    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    history.replaceState(null, "", location.pathname + location.search); return d;
  } catch { return null; }
}
function cleanBuddy(d) { if (!d || typeof d !== "object" || !d.look || typeof d.look !== "object") return null; return { look: AV.tidy(d.look), name: String(d.name || "").slice(0, 20), energy: Number.isFinite(+d.energy) ? Math.max(0, Math.min(100, +d.energy)) : 80 }; }
let buddy = cleanBuddy(fromHash()) || cleanBuddy(store.get("tribee-buddy-3d", null)), demo = !buddy;
if (buddy) store.set("tribee-buddy-3d", buddy); else buddy = { look: AV.tidy({ ...AV.DEFAULT, top: 0, topColor: 3 }), name: "", energy: 85 };
addEventListener("message", e => { if (!TRIBEE_ORIGINS.test(e.origin) || !e.data || e.data.type !== "tribee-buddy") return; const b = cleanBuddy(e.data); if (!b) return; buddy = b; demo = false; store.set("tribee-buddy-3d", b); if (P.ch) setPlayer(); });
if (parent !== window) try { parent.postMessage({ type: "seoul3d-ready" }, "*"); } catch {}

/* ================= RENDERER ================= */
const canvas = $("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const PR = Math.min(devicePixelRatio, LOW ? 1.5 : 2);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, .1, 9000);
// late-afternoon sun from the south-west; the haze colour matches the sky's horizon so distance fades naturally
const SUN_DIR = new THREE.Vector3(-.55, .38, .74).normalize();
const HORIZON = new THREE.Color("#c4cfd8"), ZENITH = new THREE.Color("#2f63b0");
scene.fog = new THREE.FogExp2(HORIZON, LOW ? .00052 : .00042);
const sun = new THREE.DirectionalLight("#ffe2bf", 3.1);
sun.castShadow = true; sun.shadow.mapSize.set(LOW ? 2048 : 4096, LOW ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 500 }); sun.shadow.bias = -.0003; sun.shadow.normalBias = .035; sun.shadow.radius = 3;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight("#bcd3f0", "#5d5040", .35); scene.add(hemi);

// Sky: Rayleigh-style gradient, horizon haze and a Mie sun halo (linear output; the final pass tone-maps)
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { zen: { value: ZENITH }, hor: { value: HORIZON }, sd: { value: SUN_DIR } },
  vertexShader: "varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_Position.z=gl_Position.w;}",
  fragmentShader: `uniform vec3 zen;uniform vec3 hor;uniform vec3 sd;varying vec3 vP;
  void main(){float h=clamp(vP.y,-.2,1.);float t=pow(max(h,0.),.42);vec3 c=mix(hor*1.08,zen,t);
    c=mix(c,hor*.82,smoothstep(0.,-.2,h));                                   // below horizon: haze
    float s=max(dot(vP,sd),0.);
    c+=vec3(1.,.78,.52)*(pow(s,8.)*.35+pow(s,64.)*.6)*(1.-t*.5);            // glow around the sun
    c+=vec3(1.,.92,.8)*smoothstep(.9994,.9998,s)*40.;                          // the sun disc
    gl_FragColor=vec4(c,1.);}`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24), skyMat); sky.scale.setScalar(8000); sky.frustumCulled = false; sky.renderOrder = -1; scene.add(sky);
// image-based lighting from that same sky, so metal and glass reflect it and shadows get sky-blue fill
function bakeEnvironment() {
  const s = new THREE.Scene(), m = new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), skyMat.clone()); s.add(m);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(49, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: "#6d6a5e" })); ground.position.y = -3; s.add(ground);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(s, .02).texture; pm.dispose();
}

/* ---------- post: bloom + filmic tone map ---------- */
const RT = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: LOW ? 2 : 4 });
const bloomA = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType }), bloomB = bloomA.clone();
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), fsScene = new THREE.Scene(), fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); fsQuad.frustumCulled = false; fsScene.add(fsQuad);
const VS = "varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}";
const brightMat = new THREE.ShaderMaterial({ uniforms: { t: { value: null } }, vertexShader: VS, fragmentShader: "uniform sampler2D t;varying vec2 vUv;void main(){vec3 c=texture2D(t,vUv).rgb;float l=max(max(c.r,c.g),c.b);gl_FragColor=vec4(c*smoothstep(1.4,3.,l),1.);}" });
const blurMat = new THREE.ShaderMaterial({ uniforms: { t: { value: null }, dir: { value: new THREE.Vector2() } }, vertexShader: VS,
  fragmentShader: "uniform sampler2D t;uniform vec2 dir;varying vec2 vUv;void main(){vec3 c=texture2D(t,vUv).rgb*.227;c+=(texture2D(t,vUv+dir*1.384).rgb+texture2D(t,vUv-dir*1.384).rgb)*.316;c+=(texture2D(t,vUv+dir*3.23).rgb+texture2D(t,vUv-dir*3.23).rgb)*.07;gl_FragColor=vec4(c,1.);}" });
const finalMat = new THREE.ShaderMaterial({ uniforms: { t: { value: RT.texture }, b: { value: bloomA.texture }, exposure: { value: 1 } }, vertexShader: VS,
  fragmentShader: `uniform sampler2D t;uniform sampler2D b;uniform float exposure;varying vec2 vUv;
  vec3 aces(vec3 x){const mat3 i=mat3(.59719,.07600,.02840,.35458,.90834,.13383,.04823,.01566,.83777);const mat3 o=mat3(1.60475,-.10208,-.00327,-.53108,1.10813,-.07276,-.07367,-.00605,1.07602);
    x=i*x;vec3 a=x*(x+.0245786)-.000090537;vec3 d=x*(.983729*x+.4329510)+.238081;return clamp(o*(a/d),0.,1.);}
  void main(){vec3 c=texture2D(t,vUv).rgb+texture2D(b,vUv).rgb*.6;c=aces(c*exposure);c=pow(c,vec3(1./2.2));
    vec2 d=vUv-.5;c*=1.-dot(d,d)*.28;gl_FragColor=vec4(c,1.);}` });
function pass(mat, target) { fsQuad.material = mat; renderer.setRenderTarget(target); renderer.render(fsScene, fsCam); }

/* ================= PROCEDURAL PBR TEXTURES ================= */
function canvasOf(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); return c; }
function texOf(c, srgb = true, rep = true) { const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = LOW ? 4 : 12; if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }
// normal map from a height canvas (bright = high)
function normalOf(hc, strength = 2) {
  const w = hc.width, h = hc.height, src = hc.getContext("2d").getImageData(0, 0, w, h).data, out = document.createElement("canvas"); out.width = w; out.height = h;
  const ctx = out.getContext("2d"), img = ctx.createImageData(w, h), H = (x, y) => src[(((y + h) % h) * w + ((x + w) % w)) * 4] / 255;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const dx = (H(x + 1, y) - H(x - 1, y)) * strength, dy = (H(x, y + 1) - H(x, y - 1)) * strength, l = Math.hypot(dx, dy, 1), i = (y * w + x) * 4; img.data[i] = (-dx / l * .5 + .5) * 255; img.data[i + 1] = (dy / l * .5 + .5) * 255; img.data[i + 2] = (1 / l * .5 + .5) * 255; img.data[i + 3] = 255; }
